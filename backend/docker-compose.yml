version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: trio
      POSTGRES_PASSWORD: trio_secret_change_me
      POSTGRES_DB: trio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trio -d trio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://trio:trio_secret_change_me@db:5432/trio"
      JWT_SECRET: "trio-jwt-production-secret-change-me"
      JWT_EXPIRES_IN: "7d"
      SESSION_SECRET: "trio-session-production-secret-change-me"
      ADMIN_PASSWORD: "admin123"
      PORT: "3000"
    entrypoint: ["sh", "/app/docker/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: